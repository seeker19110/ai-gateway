<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gateway</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Highlight.js CSS (Dark theme) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar glass">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <h1>AI Gateway</h1>
                </div>
                <button id="mobile-close" class="icon-btn mobile-only" aria-label="Đóng">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="sidebar-section">
                <h3>Chế độ Luân chuyển</h3>
                <div class="select-wrapper">
                    <select id="rotation-mode">
                        <option value="roundrobin">Luân phiên (Round Robin)</option>
                        <option value="priority">Ưu tiên</option>
                        <option value="manual">Thủ công</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-section providers-list">
                <h3>Trạng thái Nhà cung cấp</h3>
                <div id="provider-cards" class="cards-container">
                    <!-- Provider cards will be generated by JS -->
                </div>
            </div>
            
            <div class="sidebar-footer">
                <button id="btn-open-settings" class="btn btn-secondary full-width">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    <span>Cài đặt API</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content">
            <header class="top-header mobile-only">
                <button id="mobile-menu" class="icon-btn" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <div class="logo">
                    <div class="logo-icon small"></div>
                    <h2>AI Gateway</h2>
                </div>
            </header>

            <div id="chat-container">
                <div id="chat-messages">
                    <div id="empty-state" class="empty-state">
                        <div class="logo-icon large pulse"></div>
                        <h2>Chào mừng đến với AI Gateway</h2>
                        <p>Hệ thống luân chuyển thông minh giữa các mô hình AI miễn phí tốt nhất.<br>Bắt đầu cuộc trò chuyện ngay bên dưới!</p>
                    </div>
                </div>
                
                <div class="input-area glass">
                    <div class="input-wrapper">
                        <textarea id="chat-input" placeholder="Nhập tin nhắn của bạn... (Shift + Enter để xuống dòng)" rows="1"></textarea>
                        <button id="btn-send" class="btn-primary" title="Gửi tin nhắn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal glass-heavy">
            <div class="modal-header">
                <h2>Cài đặt Khóa API</h2>
                <button id="btn-close-settings" class="icon-btn" aria-label="Đóng">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">Cấu hình các khóa API của bạn để kích hoạt hệ thống luân chuyển AI.</p>
                
                <div id="api-keys-container">
                    <!-- Generated by JS -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-save-settings" class="btn btn-primary">Lưu Cài đặt</button>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/chat.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
